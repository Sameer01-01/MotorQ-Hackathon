# ==============================================================================
# FLEETSENTINEL ENTERPRISE DOCKER COMPOSE CONFIGURATION
# High-Throughput Ingestion, Polyglot Persistence & Stream Intelligence
# Profiles: 'lite' (local developer stack) | 'full' (clustered HA topology)
# ==============================================================================

version: '3.9'

networks:
  fleetsentinel-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  kafka_data:
  minio_data:

services:
  # ----------------------------------------------------------------------------
  # RELATIONAL METADATA STORE (PostgreSQL 16 with pgvector & RLS)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fleetsentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleetsentinel_oltp
      POSTGRES_USER: fleet_admin
      POSTGRES_PASSWORD: FleetPassword#2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fleetsentinel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_admin -d fleetsentinel_oltp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # DISTRIBUTED MESSAGE BROKER (Apache Kafka KRaft Mode)
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fleetsentinel-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9094'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - fleetsentinel-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # HIGH-PERFORMANCE COLUMNAR ANALYTICS (ClickHouse)
  # ----------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: fleetsentinel-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: fleetsentinel_analytics
      CLICKHOUSE_USER: click_admin
      CLICKHOUSE_PASSWORD: ClickPassword#2026
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - fleetsentinel-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # HOT VEHICLE STATE CACHE & PUB/SUB (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: fleetsentinel-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass RedisAuth#2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fleetsentinel-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "RedisAuth#2026", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # OBJECT STORAGE & COLD PARQUET ARCHIVE (MinIO S3 Compatible)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: fleetsentinel-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9005:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: MinioPassword#2026
    volumes:
      - minio_data:/data
    networks:
      - fleetsentinel-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
