# ==============================================================================
# FLEETSENTINEL CLOUD-NATIVE KUBERNETES PRODUCTION MANIFEST
# Enforces PodDisruptionBudgets, HorizontalPodAutoscaling & Resource Quotas
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetsentinel-api
  namespace: fleetsentinel
  labels:
    app.kubernetes.io/name: fleetsentinel-api
    app.kubernetes.io/part-of: fleetsentinel
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fleetsentinel-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: fleetsentinel-api
    spec:
      containers:
        - name: api
          image: ghcr.io/fleetsentinel/api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: fleetsentinel-config
            - secretRef:
                name: fleetsentinel-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fleetsentinel-api-svc
  namespace: fleetsentinel
spec:
  type: ClusterIP
  selector:
    app: fleetsentinel-api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fleetsentinel-api-hpa
  namespace: fleetsentinel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fleetsentinel-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
